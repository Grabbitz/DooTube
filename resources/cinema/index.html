<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://*.ytimg.com https://*.googleusercontent.com https://*.ggpht.com; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>DooTube Cinema</title>
  <link rel="preload" href="./BebasNeue-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./cinema.css">
  <script src="./cinema.js" defer></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M10 17V5l10-2v12M10 8l10-2"/><ellipse cx="7" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6h1M3 12h1M3 18h1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  </defs></svg>
  <main id="home" class="home" aria-live="off">
    <section id="hero" class="hero" aria-labelledby="hero-title">
      <div class="hero-art" aria-hidden="true"><img id="hero-image" alt="" fetchpriority="high"><div class="hero-shade"></div></div>
      <div class="hero-content">
        <p class="media-source"><span id="hero-mark" class="source-mark" aria-hidden="true"></span><span id="hero-source">DooTube</span><span id="hero-context" class="hero-context"></span></p>
        <h1 id="hero-title"></h1>
        <p id="hero-byline" class="hero-byline"></p>
        <div class="hero-actions">
          <button id="hero-open" class="button button-primary" type="button"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg><span>Resume</span></button>
          <button id="hero-save" class="button button-secondary" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>Save to Up Next</span></button>
        </div>
        <p id="hero-note" class="hero-note"></p>
      </div>
    </section>
    <section class="shelf-section" aria-labelledby="shelf-title">
      <div class="section-heading">
        <h2 id="shelf-title">Up Next</h2>
        <button id="queue-open" class="text-action" type="button"><span>Open queue</span><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button>
      </div>
      <div id="shelf" class="shelf" aria-live="polite"></div>
      <div id="queue-error" class="queue-error" role="status" hidden></div>
    </section>
    <section class="destinations-section" aria-labelledby="destinations-title">
      <div class="section-heading destination-heading"><h2 id="destinations-title">Browse</h2></div>
      <div id="destinations" class="destinations"></div>
    </section>
    <section id="track-section" class="track-section" aria-labelledby="track-title" hidden>
      <div class="track-art"><img id="track-image" alt="" loading="lazy"><span class="track-placeholder" aria-hidden="true"></span></div>
      <div class="track-copy"><p class="track-label">YouTube Music · now playing</p><h2 id="track-title"></h2><p id="track-artist"></p></div>
      <span id="track-state" class="track-state"></span>
    </section>
  </main>
</body>
</html>
